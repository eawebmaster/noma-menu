<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Noma — QR Kodu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#141517;--coffee:#a97d61;--coffee-dark:#765543;--paper:#fff;--line:#e9dce6;--muted:#6d6570}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fff;color:var(--ink);font-family:"DM Sans",sans-serif;display:grid;place-items:start center;padding:28px 24px 60px}.page{width:min(620px,100%);text-align:center}.logo{width:min(340px,82vw);height:auto;max-height:128px;object-fit:contain;object-position:center;overflow:visible;margin:0 auto 26px;display:block}.title{font-size:clamp(36px,7vw,58px);line-height:1;letter-spacing:-.055em;margin:0 0 24px;font-weight:700}.card{width:min(520px,100%);margin:auto;padding:34px 34px 24px;border:4px solid var(--line);border-radius:30px;background:#fff;box-shadow:0 12px 30px rgba(52,35,48,.08)}.qr-wrap{position:relative;background:#fff;padding:8px;border-radius:19px}.qr-wrap canvas{width:100%!important;height:auto!important;display:block;border-radius:14px}.qr-mark{position:absolute;left:50%;top:50%;width:88px;height:88px;transform:translate(-50%,-50%);border-radius:50%;background:var(--coffee);border:9px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.04);display:grid;place-items:center;overflow:hidden}.qr-mark::after{content:"N";font:700 49px/1 "Playfair Display",serif;color:#fff;transform:translateY(-2px)}.qr-caption{margin:24px 0 0;color:var(--ink);font-size:16px;font-weight:700;letter-spacing:.12em}.code{display:inline-block;margin-top:12px;padding:8px 18px;border-radius:9px;background:#f6f8fb;color:#121725;font-size:19px;font-weight:700;letter-spacing:.18em}.actions{display:flex;justify-content:center;gap:12px;margin:24px 0 0}.button{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:999px;padding:13px 20px;background:var(--coffee);color:#fff;font-size:13px;font-weight:700}.button.secondary{background:#fff;border:1px solid #dbc9bd;color:var(--coffee-dark)}.button:hover{filter:brightness(1.07)}.note{color:var(--muted);font-size:12px;margin:22px 0 0}@media(max-width:500px){body{padding:16px 16px 45px}.card{padding:22px 16px 18px;border-width:3px;border-radius:24px}.qr-mark{width:68px;height:68px;border-width:7px}.qr-mark::after{font-size:38px}.actions{flex-direction:column}.button{width:100%}}
  </style>
</head>
<body>
  <main class="page">
    <img class="logo" src="logpng.png" alt="Noma Coffee and More">
    <h1 class="title">QR Kodu</h1>
    <section class="card" aria-label="Noma menü QR kodu">
      <div class="qr-wrap"><div id="qrcode"></div><span class="qr-mark" aria-hidden="true"></span></div>
      <div class="qr-caption">KAMERANLA OKUT</div>
      <div class="code">NOMA24</div>
      <div class="actions"><a class="button" href="qr-menu.html">Menüyü aç</a><a class="button secondary" href="qr-menu.html">Demo menü</a></div>
    </section>
    <p class="note">Noma coffee and more · Demo QR menü</p>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const menuUrl=new URL('qr-menu.html',window.location.href).href;
    new QRCode(document.getElementById('qrcode'),{text:menuUrl,width:560,height:560,colorDark:'#141517',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
  </script>
</body>
</html>
